[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "assumptionradar"
dynamic = ["version"]
description = "Discover hidden environmental assumptions before they break your software."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SomNate" }]
dependencies = []
keywords = ["testing", "pytest", "environment", "diagnostics", "reproducibility"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Framework :: Pytest",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "build>=1.2",
    "twine>=6.0",
    "jsonschema>=4.23",
    "pre-commit>=4.0",
]

[project.scripts]
assumptionradar = "assumptionradar.cli:main"

[tool.hatch.version]
path = "src/assumptionradar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/assumptionradar"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tools/spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "DTZ", "S", "ANN", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["assumptionradar"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "ANN", "PLR2004"]
"tests/integration/**" = ["S101", "S603", "ANN", "PLR2004", "E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
source = ["assumptionradar"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
